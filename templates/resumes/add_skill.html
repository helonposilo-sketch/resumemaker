{% extends 'base.html' %}
{% load static %}

{% block title %}Add Skill - Professional Builder{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/resume-builder.css' %}">
<link rel="stylesheet" href="{% static 'css/home-gradient.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}

{% block content %}
<div class="builder-container">
    <div class="builder-sidebar">
        <div class="p-3">
            <div class="d-flex align-items-center mb-4">
                <i class="fas fa-cogs me-2" style="color: #667eea; font-size: 1.5rem;"></i>
                <h4 class="mb-0" style="color: #2c3e50;">Add Skill</h4>
            </div>
            
            <div class="form-section">
                <h5 class="section-title">
                    <i class="fas fa-star"></i> Skill Details
                </h5>
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label class="form-label">Skill Name</label>
                        {{ form.name }}
                    </div>
                    <div class="form-group">
                        <label class="form-label">Proficiency Level</label>
                        {{ form.proficiency }}
                    </div>
                    
                    <div class="d-flex gap-2 mt-4">
                        <a href="{% url 'edit_resume' resume.id %}" class="btn btn-outline-modern">Back</a>
                        <button type="submit" class="btn btn-modern flex-fill">Add Skill</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
